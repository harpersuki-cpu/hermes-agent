model:
  default: claude-opus-4-6
  provider: anthropic

agent:
  max_turns: 60

delegation:
  model: claude-opus-4-6
  provider: anthropic

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true

whatsapp:
  unauthorized_dm_behavior: ignore

security:
  redact_secrets: true

stt:
  enabled: true
  provider: groq

tts:
  provider: edge

personality_path: /opt/data/personality.md
